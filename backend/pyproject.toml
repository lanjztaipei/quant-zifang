[project]
name = "quant-zifang-backend"
version = "0.1.0"
description = "Quant Zifang（張良）每日開盤前交易掛單決策支援系統後端（波動率自適應網格 VAG Grid）"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.8.30",
    "exchange-calendars>=4.5.0",
    "fastapi>=0.115.0",
    "filelock>=3.16.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
