[project]
name = "quant-zifang-backend"
version = "0.1.0"
description = "Quant Zifang（張良）每日開盤前交易掛單決策支援系統後端（波動率自適應網格 VAG Grid）"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.8.30",
    "exchange-calendars>=4.5.0",
    "fastapi>=0.115.0",
    "filelock>=3.16.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pandas.*", "yfinance.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]
