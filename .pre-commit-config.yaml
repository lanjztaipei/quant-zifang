repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend ruff check --config backend/pyproject.toml --fix
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format --config backend/pyproject.toml
        language: system
        types_or: [python, pyi]
        files: ^backend/
